name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  matrix-test:
    name: "${{ matrix.kver }} / ${{ matrix.arch }}${{ matrix.tag }}"
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { kver: "3.10.108", image: "ubuntu:16.04", arch: "x86_64",  runtime: true }
          - { kver: "4.4.302",  image: "ubuntu:16.04", arch: "x86_64",  runtime: true }
          - { kver: "4.19.325", image: "ubuntu:18.04", arch: "x86_64",  runtime: true }
          - { kver: "5.4.290",  image: "ubuntu:20.04", arch: "x86_64",  runtime: true }
          - { kver: "5.10.271", image: "ubuntu:20.04", arch: "x86_64",  runtime: true }
          - { kver: "5.15.180", image: "ubuntu:22.04", arch: "x86_64",  runtime: true }
          - { kver: "6.1.189",  image: "ubuntu:22.04", arch: "x86_64",  runtime: true }
          - { kver: "6.6.158",  image: "ubuntu:22.04", arch: "x86_64",  runtime: true }
          - { kver: "6.12.35",  image: "ubuntu:24.04", arch: "x86_64",  runtime: true }
          - { kver: "6.18.56",  image: "ubuntu:24.04", arch: "x86_64",  runtime: true }
          - { kver: "7.2.10",   image: "ubuntu:24.04", arch: "x86_64",  runtime: true }
          # Cross-architecture QEMU runtime jobs: qarch selects the QEMU
          # emulator/mapping used by run-in-container.sh; the -rt tag
          # distinguishes runtime jobs in artifacts and job names.  Older
          # kernels run on era-matched images because their toolchains do
          # not build with a current gcc.  Architecture floors: arm64 has
          # no usable mainline defconfig before 4.4, powerpc little-endian
          # was merged in 3.13 (the matrix starts at 4.4), and riscv only
          # exists from 4.15 on (the matrix starts at 4.19).
          # aarch64
          - { kver: "4.4.302",  image: "ubuntu:16.04", arch: "aarch64", runtime: true, qarch: "aarch64", tag: "-rt" }
          - { kver: "4.19.325", image: "ubuntu:18.04", arch: "aarch64", runtime: true, qarch: "aarch64", tag: "-rt" }
          - { kver: "5.4.290",  image: "ubuntu:20.04", arch: "aarch64", runtime: true, qarch: "aarch64", tag: "-rt" }
          - { kver: "5.10.271", image: "ubuntu:20.04", arch: "aarch64", runtime: true, qarch: "aarch64", tag: "-rt" }
          - { kver: "5.15.180", image: "ubuntu:22.04", arch: "aarch64", runtime: true, qarch: "aarch64", tag: "-rt" }
          - { kver: "6.1.189",  image: "ubuntu:22.04", arch: "aarch64", runtime: true, qarch: "aarch64", tag: "-rt" }
          - { kver: "6.6.158",  image: "ubuntu:22.04", arch: "aarch64", runtime: true, qarch: "aarch64", tag: "-rt" }
          - { kver: "6.12.35",  image: "ubuntu:24.04", arch: "aarch64", runtime: true, qarch: "aarch64", tag: "-rt" }
          - { kver: "6.18.56",  image: "ubuntu:24.04", arch: "aarch64", runtime: true, qarch: "aarch64", tag: "-rt" }
          - { kver: "7.2.10",   image: "ubuntu:24.04", arch: "aarch64", runtime: true, qarch: "aarch64", tag: "-rt" }
          # armv7
          # ROW REMOVED (TCG limitation): 3.10.108/armv7 is not bootable
          # in this era-QEMU harness.  On 16.04/QEMU 2.5 a verified-good
          # 2MB zImage (ARCH_VEXPRESS, DEBUG_LL via debug/vexpress.S RS1
          # port 0x1c090000) plus an explicit vexpress-v2p-ca9.dtb never
          # printed a byte in 7 minutes - the kernel never starts executing
          # on QEMU 2.5's vexpress-a9 (vexpress-a15 equally silent).  On
          # 20.04/QEMU 4.2 the kernel does not even compile: gcc-9 chokes
          # on 3.10's fs/aio.c (.err at asm level).  Recorded attempts:
          # virt (no ATAGS-capable machine id), vexpress-a9/-a15 x
          # QEMU 2.5/4.2, DEBUG_LL first-instruction output - all silent.
          - { kver: "4.4.302",  image: "ubuntu:16.04", arch: "armv7",   runtime: true, qarch: "armv7",   tag: "-rt" }
          - { kver: "4.19.325", image: "ubuntu:18.04", arch: "armv7",   runtime: true, qarch: "armv7",   tag: "-rt" }
          - { kver: "5.4.290",  image: "ubuntu:20.04", arch: "armv7",   runtime: true, qarch: "armv7",   tag: "-rt" }
          - { kver: "5.10.271", image: "ubuntu:20.04", arch: "armv7",   runtime: true, qarch: "armv7",   tag: "-rt" }
          - { kver: "5.15.180", image: "ubuntu:22.04", arch: "armv7",   runtime: true, qarch: "armv7",   tag: "-rt" }
          - { kver: "6.1.189",  image: "ubuntu:22.04", arch: "armv7",   runtime: true, qarch: "armv7",   tag: "-rt" }
          - { kver: "6.6.158",  image: "ubuntu:22.04", arch: "armv7",   runtime: true, qarch: "armv7",   tag: "-rt" }
          - { kver: "6.12.35",  image: "ubuntu:24.04", arch: "armv7",   runtime: true, qarch: "armv7",   tag: "-rt" }
          - { kver: "6.18.56",  image: "ubuntu:24.04", arch: "armv7",   runtime: true, qarch: "armv7",   tag: "-rt" }
          - { kver: "7.2.10",   image: "ubuntu:24.04", arch: "armv7",   runtime: true, qarch: "armv7",   tag: "-rt" }
          # mips (little-endian o32 Malta)
          - { kver: "3.10.108", image: "ubuntu:16.04", arch: "mips",    runtime: true, qarch: "mips",    tag: "-rt" }
          - { kver: "4.4.302",  image: "ubuntu:16.04", arch: "mips",    runtime: true, qarch: "mips",    tag: "-rt" }
          - { kver: "4.19.325", image: "ubuntu:18.04", arch: "mips",    runtime: true, qarch: "mips",    tag: "-rt" }
          - { kver: "5.4.290",  image: "ubuntu:20.04", arch: "mips",    runtime: true, qarch: "mips",    tag: "-rt" }
          - { kver: "5.10.271", image: "ubuntu:20.04", arch: "mips",    runtime: true, qarch: "mips",    tag: "-rt" }
          - { kver: "5.15.180", image: "ubuntu:22.04", arch: "mips",    runtime: true, qarch: "mips",    tag: "-rt" }
          - { kver: "6.1.189",  image: "ubuntu:22.04", arch: "mips",    runtime: true, qarch: "mips",    tag: "-rt" }
          - { kver: "6.6.158",  image: "ubuntu:22.04", arch: "mips",    runtime: true, qarch: "mips",    tag: "-rt" }
          - { kver: "6.12.35",  image: "ubuntu:24.04", arch: "mips",    runtime: true, qarch: "mips",    tag: "-rt" }
          - { kver: "6.18.56",  image: "ubuntu:24.04", arch: "mips",    runtime: true, qarch: "mips",    tag: "-rt" }
          - { kver: "7.2.10",   image: "ubuntu:24.04", arch: "mips",    runtime: true, qarch: "mips",    tag: "-rt" }
          # powerpc (ppc64le pseries)
          # ROW REMOVED (TCG limitation): the 4.4.302 ppc64le guest never
          # produces a byte after SLOF's "Booting from memory..." under
          # any era TCG combination tried - 16.04/QEMU 2.5, 18.04/2.11,
          # 20.04/4.2 x POWER9/POWER8/POWER7, with and without the initrd
          # (no-initrd probe: a booting kernel would at least print its
          # banner or a "No init found" panic), LE (BE dies inside SLOF
          # itself on the first instruction).  TCG 2.11 even lacks book3s
          # DABR (SPR 1012) emulation; QEMU 4.2 has it, still silent.  Not
          # a kernel config issue - same-tree 4.19+ powerpc rows are green.
          - { kver: "4.19.325", image: "ubuntu:18.04", arch: "powerpc", runtime: true, qarch: "powerpc", tag: "-rt" }
          - { kver: "5.4.290",  image: "ubuntu:20.04", arch: "powerpc", runtime: true, qarch: "powerpc", tag: "-rt" }
          - { kver: "5.10.271", image: "ubuntu:20.04", arch: "powerpc", runtime: true, qarch: "powerpc", tag: "-rt" }
          - { kver: "5.15.180", image: "ubuntu:22.04", arch: "powerpc", runtime: true, qarch: "powerpc", tag: "-rt" }
          - { kver: "6.1.189",  image: "ubuntu:22.04", arch: "powerpc", runtime: true, qarch: "powerpc", tag: "-rt" }
          - { kver: "6.6.158",  image: "ubuntu:22.04", arch: "powerpc", runtime: true, qarch: "powerpc", tag: "-rt" }
          - { kver: "6.12.35",  image: "ubuntu:24.04", arch: "powerpc", runtime: true, qarch: "powerpc", tag: "-rt" }
          - { kver: "6.18.56",  image: "ubuntu:24.04", arch: "powerpc", runtime: true, qarch: "powerpc", tag: "-rt" }
          - { kver: "7.2.10",   image: "ubuntu:24.04", arch: "powerpc", runtime: true, qarch: "powerpc", tag: "-rt" }
          # riscv (rv64; the arch only exists from 4.15, matrix starts 4.19)
          - { kver: "4.19.325", image: "ubuntu:20.04", arch: "riscv",   runtime: true, qarch: "riscv",   tag: "-rt" }
          - { kver: "5.4.290",  image: "ubuntu:20.04", arch: "riscv",   runtime: true, qarch: "riscv",   tag: "-rt" }
          - { kver: "5.10.271", image: "ubuntu:20.04", arch: "riscv",   runtime: true, qarch: "riscv",   tag: "-rt" }
          - { kver: "5.15.180", image: "ubuntu:22.04", arch: "riscv",   runtime: true, qarch: "riscv",   tag: "-rt" }
          - { kver: "6.1.189",  image: "ubuntu:22.04", arch: "riscv",   runtime: true, qarch: "riscv",   tag: "-rt" }
          - { kver: "6.6.158",  image: "ubuntu:22.04", arch: "riscv",   runtime: true, qarch: "riscv",   tag: "-rt" }
          - { kver: "6.12.35",  image: "ubuntu:24.04", arch: "riscv",   runtime: true, qarch: "riscv",   tag: "-rt" }
          - { kver: "6.18.56",  image: "ubuntu:24.04", arch: "riscv",   runtime: true, qarch: "riscv",   tag: "-rt" }
          - { kver: "7.2.10",   image: "ubuntu:24.04", arch: "riscv",   runtime: true, qarch: "riscv",   tag: "-rt" }

    steps:
      - uses: actions/checkout@v4

      - name: Build kernel + compile ALIRT + QEMU detection test (runs in era-matched container)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src \
            "${{ matrix.image }}" bash /src/tests/ci/run-in-container.sh \
            "${{ matrix.kver }}" "${{ matrix.arch }}" "${{ matrix.runtime }}" "${{ matrix.qarch }}"

      - name: Record test result for this matrix combination
        if: always()
        run: |
          mkdir -p status
          COMPILE=fail; [ -f src/mod_hunter/mod_hunter.ko ] && COMPILE=ok
          RUNTIME=skip
          grep -q "RUNTIME-RESULT: PASS" vm-console.log 2>/dev/null && RUNTIME=pass
          grep -q "RUNTIME-RESULT: FAIL" vm-console.log 2>/dev/null && RUNTIME=fail
          echo "| ${{ matrix.kver }} | ${{ matrix.arch }}${{ matrix.tag }} | $COMPILE | $RUNTIME |" \
            > "status/${{ matrix.kver }}-${{ matrix.arch }}${{ matrix.tag }}.md"
          cat "status/${{ matrix.kver }}-${{ matrix.arch }}${{ matrix.tag }}.md"

      - name: Keep the VM console log for runtime debugging
        if: always()
        run: |
          mkdir -p status
          [ -f vm-console.log ] && cp vm-console.log \
              "status/vm-console-${{ matrix.kver }}-${{ matrix.arch }}${{ matrix.tag }}.log" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "status-${{ matrix.kver }}-${{ matrix.arch }}${{ matrix.tag }}"
          path: status/

  summary:
    needs: matrix-test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: status-*
          merge-multiple: true
          path: statuses

      - name: Generate compatibility matrix summary
        run: |
          {
            echo "## Kernel / Architecture Compatibility Matrix (build & QEMU runtime detection)"
            echo ""
            echo "| Kernel | Arch | Build | QEMU runtime |"
            echo "|---|---|---|---|"
            sort -t'|' -k2 -V statuses/*.md
          } >> "$GITHUB_STEP_SUMMARY"
